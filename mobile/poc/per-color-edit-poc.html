<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartCell · Per-color edit POC</title>
<style>
  :root{
    --indigo:#4f46e5; --indigo-bg:#eef0fd; --ink:#111827; --sub:#6b7280;
    --line:#e5e7eb; --card:#ffffff; --bg:#f3f4f6; --ok:#059669; --warn:#b45309;
    --warn-bg:#fef3c7; --danger:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#e9eaf0;color:var(--ink)}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .lead{color:var(--sub);font-size:14px;margin:0 0 18px;line-height:1.5}

  /* option switcher */
  .switch{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
  .opt{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
  .opt:hover{border-color:#c7c9f7}
  .opt.active{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .opt .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--indigo);background:var(--indigo-bg);padding:2px 8px;border-radius:999px;margin-bottom:6px}
  .opt h3{font-size:13px;margin:0 0 4px}
  .opt p{font-size:11.5px;color:var(--sub);margin:0;line-height:1.45}
  @media(max-width:760px){.switch{grid-template-columns:1fr}}

  /* phone */
  .stage{display:flex;justify-content:center}
  .phone{width:390px;max-width:100%;height:760px;background:var(--bg);border-radius:34px;border:10px solid #14151a;
    box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;position:relative;display:flex;flex-direction:column}
  .nav{height:52px;flex:0 0 52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:5}
  .nav .title{font-weight:700;font-size:16px}
  .nav .back{font-size:22px;line-height:1;color:var(--indigo);cursor:pointer;padding:4px 6px;border-radius:8px;width:34px;text-align:center}
  .nav .back:active{background:#f0f0ff}
  .screen{flex:1;overflow-y:auto;padding:14px;position:relative}

  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #f0f0f3}
  .row-card{cursor:pointer;transition:.12s}
  .row-card:active{transform:scale(.99);background:#fafafe}
  .brandline{display:flex;align-items:center;gap:12px;margin-bottom:2px}
  .thumb{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#b8c6db,#8ea3c0);flex:0 0 52px;display:flex;align-items:center;justify-content:center;font-size:22px}
  .model{font-size:17px;font-weight:700;line-height:1.15}
  .muted{color:var(--sub);font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 6px}
  .chip{font-size:12px;font-weight:600;color:var(--indigo);background:var(--indigo-bg);padding:4px 9px;border-radius:8px}
  .chip.gray{color:#374151;background:#f1f2f5}
  .chip.color{color:#7c2d92;background:#f6ecfb}
  .cfg-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px}
  .price{font-size:19px;font-weight:800}
  .pcs{color:var(--sub);font-size:13px;text-align:right}
  .chev{color:#c4c7cf;font-size:20px;margin-left:6px}
  .rowflex{display:flex;align-items:center;justify-content:space-between}

  /* detail */
  .hdr{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
  .hdr .m{font-size:20px;font-weight:800}
  .hdr .b{opacity:.85;font-size:13px;margin-bottom:8px}
  .hdr .attrs{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .hdr .attr{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:8px}
  .hdr .attr.color{background:rgba(255,255,255,.32)}
  .hdr .instock{margin-top:10px;font-size:12.5px;opacity:.9}

  .sect{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);margin:16px 4px 8px}
  .scope{font-size:12px;padding:8px 10px;border-radius:10px;margin-bottom:10px;line-height:1.4}
  .scope.all{background:var(--warn-bg);color:var(--warn)}
  .scope.one{background:#dcfce7;color:var(--ok)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px}
  .field select,.field input{width:100%;font-size:15px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit}
  .field select:focus,.field input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.12)}

  .colorrow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f1f2f5}
  .colorrow:last-child{border-bottom:none}
  .cdot{width:22px;height:22px;border-radius:50%;flex:0 0 22px;border:1px solid rgba(0,0,0,.12)}
  .cname{font-weight:600;font-size:14px}
  .cmeta{font-size:12px;color:var(--sub)}
  .spacer{flex:1}
  .switchui{width:44px;height:26px;border-radius:999px;background:#d1d5db;position:relative;cursor:pointer;transition:.15s;flex:0 0 44px}
  .switchui.on{background:var(--indigo)}
  .knob{width:22px;height:22px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .switchui.on .knob{left:20px}
  .btn{font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;color:#374151}
  .btn:active{background:#f3f4f6}
  .btn.move{color:var(--indigo);border-color:#d5d6fb}
  .btn.primary{background:var(--indigo);color:#fff;border-color:var(--indigo);width:100%;padding:12px;font-size:15px;margin-top:8px}
  .imgstrip{display:flex;gap:8px;margin-top:8px}
  .imgbox{width:56px;height:56px;border-radius:10px;background:#f1f2f5;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:20px;border:1px dashed #d1d5db}

  /* toast + sheet */
  .toast{position:absolute;left:12px;right:12px;bottom:14px;background:#111827;color:#fff;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.4;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.warn{background:#7c2d12}
  .toast.ok{background:#065f46}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none;align-items:flex-end}
  .sheet-bg.show{display:flex}
  .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 16px 22px;animation:up .2s}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h4{margin:0 0 10px;font-size:16px}
  .note{font-size:12px;color:var(--sub);line-height:1.5;margin:10px 0}
  .hint{font-size:11.5px;color:var(--sub);margin:6px 4px 0;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
  <h1>SmartCell · Per-color edit — 3 options</h1>
  <p class="lead">Tap a config (or color) in the phone, then change <b>PTA status</b> and watch the message.
  The point: how far a per-color edit reaches differs by option. Switch options below.</p>

  <div class="switch" id="switch"></div>

  <div class="stage">
    <div class="phone">
      <div class="nav">
        <div class="back" id="back" style="visibility:hidden">‹</div>
        <div class="title" id="navtitle">Variants</div>
      </div>
      <div class="screen" id="screen"></div>
      <div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
  <p class="hint" style="text-align:center;max-width:390px;margin:14px auto 0">
    This is a static front-end mock — nothing writes to the database.</p>
</div>

<script>
const OPTIONS = {
  A:{tag:'Option A', name:'Config-level + clear split', rows:'config',
     desc:'Storage/PTA/condition/price stay config-wide but clearly labeled. Per-color: visibility, images, stock + a "Move color" action. No schema change.'},
  B:{tag:'Option B', name:'Per-color rows, split identity', rows:'color',
     desc:'Color becomes part of the config. Each color is fully independent — changing PTA on Bay affects only Bay. Bigger refactor.'},
  C:{tag:'Option C', name:'Per-color rows, cosmetic', rows:'color',
     desc:'List fans out per color for navigation, but edits still hit the whole config (with a warning). Least work.'},
};
let current='A';

// seed data (fresh copy each render so the demo is repeatable)
function seed(){return [
  {id:'c1',model:'Pixel 8 Pro',brand:'Google',storage:128,condition:'Used',pta:'PTA Approved',price:123000,
   colors:[{name:'Bay',hex:'#b9c7e8',stock:2,visible:true},{name:'Obsidian',hex:'#2b2b30',stock:1,visible:true},{name:'Porcelain',hex:'#ede6dc',stock:1,visible:true}]},
  {id:'c2',model:'Pixel 8 Pro',brand:'Google',storage:256,condition:'Used',pta:'PTA Approved',price:132000,
   colors:[{name:'Bay',hex:'#b9c7e8',stock:2,visible:true},{name:'Obsidian',hex:'#2b2b30',stock:2,visible:true}]},
];}
let data=seed();

const el=id=>document.getElementById(id);
const screen=el('screen');

function renderSwitch(){
  el('switch').innerHTML=Object.entries(OPTIONS).map(([k,o])=>`
    <div class="opt ${k===current?'active':''}" data-k="${k}">
      <span class="tag">${o.tag}</span>
      <h3>${o.name}</h3><p>${o.desc}</p>
    </div>`).join('');
  document.querySelectorAll('.opt').forEach(n=>n.onclick=()=>{current=n.dataset.k;data=seed();renderSwitch();goList();});
}

function goList(){
  el('back').style.visibility='hidden';
  el('navtitle').textContent='Variants';
  const o=OPTIONS[current];
  let html='';
  if(o.rows==='config'){
    data.forEach(c=>{
      const totStock=c.colors.reduce((s,x)=>s+x.stock,0);
      html+=`<div class="card row-card" onclick="goDetail('${c.id}')">
        <div class="brandline"><div class="thumb">📱</div>
          <div><div class="model">${c.model}</div>
          <div class="muted">${c.colors.length} configs · ${totStock} in stock</div></div></div>
        <div class="chips"><span class="chip">${c.storage} GB</span><span class="chip">${c.condition}</span><span class="chip">${c.pta}</span></div>
        <div class="muted">${c.colors.map(x=>x.name).join(' · ')}</div>
        <div class="cfg-foot"><div class="price">Rs ${c.price.toLocaleString()}</div>
          <div class="rowflex"><div class="pcs">${totStock} pcs</div><div class="chev">›</div></div></div>
      </div>`;
    });
  } else {
    data.forEach(c=>c.colors.forEach(col=>{
      html+=`<div class="card row-card" onclick="goDetail('${c.id}','${col.name}')">
        <div class="brandline"><div class="thumb">📱</div>
          <div><div class="model">${c.model}</div><div class="muted">${c.brand}</div></div></div>
        <div class="chips"><span class="chip">${c.storage} GB</span><span class="chip">${c.condition}</span>
          <span class="chip">${c.pta}</span><span class="chip color">${col.name}</span></div>
        <div class="cfg-foot"><div class="price">Rs ${c.price.toLocaleString()}</div>
          <div class="rowflex"><div class="pcs">${col.stock} pcs</div><div class="chev">›</div></div></div>
      </div>`;
    }));
  }
  screen.innerHTML=html;
}

function goDetail(cid,colorName){
  const c=data.find(x=>x.id===cid);
  el('back').style.visibility='visible';
  el('back').onclick=goList;
  el('navtitle').textContent='Edit variant';
  const opt=OPTIONS[current];
  if(opt.rows==='config') renderConfigDetail(c);
  else renderColorDetail(c,colorName);
}

/* ---------- Option A: config-level with per-color section ---------- */
function renderConfigDetail(c){
  const tot=c.colors.reduce((s,x)=>s+x.stock,0);
  let html=`
  <div class="hdr">
    <div class="m">${c.model}</div><div class="b">${c.brand}</div>
    <div class="attrs">
      <span class="attr">${c.storage} GB</span><span class="attr">${c.condition}</span><span class="attr">${c.pta}</span>
    </div>
    <div class="instock">${c.colors.length} colors · ${tot} in stock</div>
  </div>

  <div class="sect">Configuration</div>
  <div class="scope all">⚠ These apply to <b>all ${c.colors.length} colors</b> (${c.colors.map(x=>x.name).join(', ')}).</div>
  <div class="field"><label>Selling price (Rs)</label><input value="${c.price}" onchange="toast('Price → Rs '+this.value+' for ALL colors','warn')"></div>
  <div class="field"><label>Storage</label>${sel(['64','128','256','512'],String(c.storage),'GB','Storage','warn',' for ALL colors')}</div>
  <div class="field"><label>Condition</label>${sel(['New','Used','Refurbished'],c.condition,'','Condition','warn',' for ALL colors')}</div>
  <div class="field"><label>PTA status</label>${sel(['PTA Approved','Non-PTA'],c.pta,'','PTA','warn',' — changes '+c.colors.map(x=>x.name).join(', '))}</div>

  <div class="sect">Colors — each independent</div>`;
  c.colors.forEach((col,i)=>{
    html+=`<div class="card" style="padding:10px 12px">
      <div class="colorrow">
        <div class="cdot" style="background:${col.hex}"></div>
        <div><div class="cname">${col.name}</div><div class="cmeta">${col.stock} in stock</div></div>
        <div class="spacer"></div>
        <div class="switchui ${col.visible?'on':''}" onclick="tglVis('${c.id}',${i},this)"><div class="knob"></div></div>
      </div>
      <div class="rowflex" style="padding:2px 4px 4px">
        <div class="imgstrip"><div class="imgbox">🖼️</div><div class="imgbox">＋</div></div>
        <button class="btn move" onclick="moveSheet('${c.id}',${i})">Move ${col.name} →</button>
      </div>
    </div>`;
  });
  html+=`<div class="hint">Visibility &amp; images are truly per-color. To change PTA/condition for one color only, use “Move” — it reclassifies just that color's units into another config.</div>`;
  screen.innerHTML=html;
}

/* ---------- Option B & C: per-color detail ---------- */
function renderColorDetail(c,colorName){
  const col=c.colors.find(x=>x.name===colorName)||c.colors[0];
  const isB=current==='B';
  const others=c.colors.filter(x=>x.name!==col.name).map(x=>x.name);
  let html=`
  <div class="hdr">
    <div class="m">${c.model}</div><div class="b">${c.brand}</div>
    <div class="attrs">
      <span class="attr">${c.storage} GB</span><span class="attr">${c.condition}</span>
      <span class="attr">${c.pta}</span><span class="attr color">${col.name}</span>
    </div>
    <div class="instock">${col.stock} in stock</div>
  </div>`;

  if(isB){
    html+=`<div class="scope one">✓ Independent config — edits here affect <b>${col.name} only</b>.</div>`;
  } else {
    html+=`<div class="scope all">⚠ ${col.name} shares its config with ${others.join(' &amp; ')||'no other color'}. Editing price/PTA/storage changes them too.</div>`;
  }
  const reach = isB ? (' for '+col.name+' only') : (others.length?(' — also changes '+others.join(', ')):'');
  const kind = isB ? 'ok':'warn';
  html+=`
  <div class="sect">Attributes</div>
  <div class="field"><label>Selling price (Rs)</label><input value="${c.price}" onchange="toast('Price → Rs '+this.value+'${escapeApos(reach)}','${kind}')"></div>
  <div class="field"><label>Storage</label>${sel(['64','128','256','512'],String(c.storage),'GB','Storage',kind,reach)}</div>
  <div class="field"><label>Condition</label>${sel(['New','Used','Refurbished'],c.condition,'','Condition',kind,reach)}</div>
  <div class="field"><label>PTA status</label>${sel(['PTA Approved','Non-PTA'],c.pta,'','PTA',kind,reach)}</div>

  <div class="sect">${col.name} — media &amp; stock</div>
  <div class="card">
    <div class="colorrow"><div class="cdot" style="background:${col.hex}"></div>
      <div><div class="cname">${col.name}</div><div class="cmeta">${col.stock} in stock</div></div>
      <div class="spacer"></div>
      <div class="switchui ${col.visible?'on':''}" onclick="tglVisSolo(this)"><div class="knob"></div></div>
    </div>
    <div class="imgstrip" style="padding:4px"><div class="imgbox">🖼️</div><div class="imgbox">＋</div></div>
  </div>`;
  screen.innerHTML=html;
}

/* helpers */
function sel(vals,cur,suffix,kindLabel,toastKind,reach){
  const opts=vals.map(v=>`<option ${v===cur?'selected':''}>${v}${suffix?(' '+suffix):''}</option>`).join('');
  return `<select onchange="toast('${kindLabel} → '+this.value+'${escapeApos(reach||'')}','${toastKind}')">${opts}</select>`;
}
function escapeApos(s){return (s||'').replace(/'/g,"\\'");}

function tglVis(cid,i,node){const c=data.find(x=>x.id===cid);c.colors[i].visible=!c.colors[i].visible;
  node.classList.toggle('on');toast(c.colors[i].name+(c.colors[i].visible?' shown in catalog':' hidden from catalog')+' (this color only)','ok');}
function tglVisSolo(node){node.classList.toggle('on');toast('Visibility changed for this color only','ok');}

let toastT;
function toast(msg,kind){const t=el('toast');t.className='toast show '+(kind||'');t.innerHTML=msg;
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* Option A move sheet */
function moveSheet(cid,i){
  const c=data.find(x=>x.id===cid);const col=c.colors[i];
  const target = c.pta==='PTA Approved'?'Non-PTA':'PTA Approved';
  el('sheet').innerHTML=`
    <h4>Move “${col.name}” to another config</h4>
    <div class="note">Reassigns <b>${col.stock} ${col.name}</b> unit(s) out of<br>
      <b>${c.model} · ${c.storage}GB · ${c.condition} · ${c.pta}</b><br>into a different config. Other colors here are untouched.</div>
    <div class="field"><label>New PTA status for ${col.name}</label>
      <select id="mvpta"><option ${target==='PTA Approved'?'selected':''}>PTA Approved</option><option ${target==='Non-PTA'?'selected':''}>Non-PTA</option></select></div>
    <button class="btn primary" onclick="doMove('${cid}',${i})">Move ${col.name}</button>
    <div class="hint" style="text-align:center">If no such config exists yet, it's created automatically.</div>`;
  el('sheetbg').classList.add('show');
  el('sheetbg').onclick=e=>{if(e.target===el('sheetbg'))el('sheetbg').classList.remove('show');};
}
function doMove(cid,i){
  const c=data.find(x=>x.id===cid);const col=c.colors[i];
  const newpta=document.getElementById('mvpta').value;
  c.colors.splice(i,1);
  el('sheetbg').classList.remove('show');
  if(c.colors.length){renderConfigDetail(c);} else {goList();}
  toast(`Moved ${col.stock} ${col.name} unit(s) → ${c.model} ${c.storage}GB ${c.condition} ${newpta}. Other colors unchanged.`,'ok');
}

renderSwitch();goList();
</script>
</body>
</html>
