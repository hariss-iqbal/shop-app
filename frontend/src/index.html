<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Smart Cell</title>
  <base href="/">
  <!-- F-025: Mobile-Optimized Viewport Settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1220">
  <meta name="description" content="Buy new and used phones at Smart Cell — PTA approved and non-PTA stock, honest pricing, fast delivery across Pakistan.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">

  <!-- Meta (Facebook) domain verification for smartcell.pk, Business portfolio
       "SmartCell" (id 1178510318677691). Proves we own the domain, which is what
       unlocks Aggregated Event Measurement — i.e. choosing which of our pixel
       events Meta prioritises for iOS attribution.

       Must stay a STATIC tag inside <head>. Meta's crawler does not run
       JavaScript, so moving this into SeoService or any runtime-injected tag
       silently fails verification. -->
  <meta name="facebook-domain-verification" content="rms45xa2w1f0wu7dig2ozuxja2ckf1" />

  <!-- Default social link preview.
       SeoService rewrites these per route, but only after Angular boots, and
       social crawlers don't run JavaScript — so these static values are what
       WhatsApp/Facebook/Twitter actually read for any non-product URL.
       Product URLs are served with real per-product tags by api/og.js. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Smart Cell">
  <meta property="og:title" content="Smart Cell">
  <meta property="og:description" content="Buy new and used phones at Smart Cell — PTA approved and non-PTA stock, honest pricing, fast delivery across Pakistan.">
  <meta property="og:url" content="https://www.smartcell.pk/">
  <meta property="og:image" content="https://www.smartcell.pk/icons/icon-512x512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Smart Cell">
  <meta name="twitter:description" content="Buy new and used phones at Smart Cell — PTA approved and non-PTA stock, honest pricing, fast delivery across Pakistan.">
  <meta name="twitter:image" content="https://www.smartcell.pk/icons/icon-512x512.png">

  <!-- Favicons and App Icons -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon-source.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96x96.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-72x72.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Apple-specific PWA meta tags -->
  <link rel="apple-touch-icon" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Phone Shop">
  <link rel="apple-touch-startup-image" href="icons/icon-512x512.png">

  <!-- Microsoft Tile -->
  <meta name="msapplication-TileImage" content="icons/icon-144x144.png">
  <meta name="msapplication-TileColor" content="#f5f7f8">

  <!-- Google Fonts: Inter, Geist, Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Preconnect to Supabase for faster API calls -->
  <link rel="dns-prefetch" href="https://supabase.co">

  <script>
    // F-056: Apply saved theme before Angular bootstraps to prevent flash of wrong theme
    (function() {
      var theme = localStorage.getItem('phone-shop-theme');
      var isDark = theme === 'dark';
      if (isDark) {
        document.documentElement.classList.add('dark-theme');
        document.documentElement.setAttribute('data-theme', 'dark');
        var meta = document.querySelector('meta[name="theme-color"]:not([media])');
        if (meta) meta.setAttribute('content', '#0c1220');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }

      // F-025: Detect and mark touch device for CSS optimizations
      if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
        document.documentElement.classList.add('touch-device');
      }

      // F-025: Detect standalone mode (PWA installed)
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
        document.documentElement.classList.add('pwa-standalone');
      }
    })();
  </script>

  <style>
    /* Critical CSS for initial paint - prevents layout shift */
    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      overflow-x: clip;
    }

    app-root {
      display: block;
    }

    /* F-025: Safe area insets for notched devices */
    .pwa-standalone body {
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* F-025: Prevent pull-to-refresh on mobile in PWA mode */
    .pwa-standalone {
      overscroll-behavior-y: contain;
    }

    /* F-025: Touch device optimizations */
    .touch-device * {
      -webkit-touch-callout: none;
    }

    .touch-device button,
    .touch-device a,
    .touch-device input,
    .touch-device select,
    .touch-device textarea {
      touch-action: manipulation;
    }
  </style>

  <!-- Meta Pixel Code -->
  <script>
    // Live site only. index.html isn't touched by Angular's fileReplacements, so
    // without this guard `ng serve` and every Vercel preview deploy would fire
    // real events into the production pixel — polluting the retargeting
    // audiences and conversion data that ad spend is optimised against.
    (function () {
      var LIVE_HOSTS = ['smartcell.pk', 'www.smartcell.pk'];
      if (LIVE_HOSTS.indexOf(location.hostname) === -1) return;

      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1888423905552768');
      fbq('track', 'PageView');
    })();
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1888423905552768&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Code -->
</head>
<body>
  <noscript>Please enable JavaScript to use this application.</noscript>
  <app-root></app-root>
</body>
</html>
